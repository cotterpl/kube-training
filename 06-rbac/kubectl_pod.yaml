apiVersion: v1
kind: Pod
metadata:
  name: kubectl-pod
spec:
  containers:
    - image: alpine/k8s:1.30.6
      command:
        - "kubectl"
        - "run"
        - "pod-inception"
        - "--image=grzegorzskorupa/myapp:1.0.0"
      imagePullPolicy: IfNotPresent
      name: kubectl-pod
  restartPolicy: Never